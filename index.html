<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PVT練習テスト</title>

<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    margin-top: 100px;
}

#box {
    width: 300px;
    height: 200px;
    background: gray;
    margin: auto;
    line-height: 200px;
    font-size: 40px;
    color: white;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

#box.waiting {
    font-size: 80px;
}

.instruction {
    font-size: 40px;
    font-weight: bold;
}

#enterStart {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    color: #111;
    font-size: 24px;
    font-weight: bold;
    user-select: none;
}

#preparationMessage {
    min-height: 36px;
    margin-top: 18px;
    font-size: 20px;
}

#countdown {
    min-height: 58px;
    margin-top: 8px;
    font-size: 48px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="enterStart" aria-live="polite">
    Enterキーを押して待機を開始してください
</div>

<p
    id="taskInstruction"
    class="instruction"
    style="visibility:hidden;"
>
    赤になったらすぐEnterキー！
</p>

<div id="box" class="waiting">✖</div>
<div id="countdown"></div>
<div id="preparationMessage"></div>

<script>
'use strict';

/* ==================================================
   実験設定
================================================== */

const TEST_DURATION = 30000;
const PREPARATION_DURATION = 30000;
const COUNTDOWN_DURATION = 5000;

/*
最初のEnterキー押下時と、
タスク開始5秒前の警告音
*/
const WARNING_TONE = {
    frequency: 659.25,
    duration: 500,
    volume: 0.20
};

/*
タスク開始時と課題終了時の音
*/
const EVENT_TONE = {
    frequency: 880,
    duration: 600,
    volume: 0.22
};

/* ==================================================
   状態
================================================== */

let startTime;

let waiting = false;
let isRunning = false;
let isPreparing = false;
let preparationStarted = false;

let nextStimulusPerfTime;

let stimulusTimer = null;
let forceEndTimer = null;
let preparationTimer = null;
let countdownStartTimer = null;
let countdownInterval = null;

let results = [];
let audioContext = null;
let keyLocked = false;

/* ==================================================
   DOM
================================================== */

const box =
    document.getElementById("box");

const enterStartDiv =
    document.getElementById("enterStart");

const taskInstruction =
    document.getElementById("taskInstruction");

const countdownDiv =
    document.getElementById("countdown");

const preparationMessage =
    document.getElementById("preparationMessage");

/* ==================================================
   音声
================================================== */

function getAudioContext() {
    if (!audioContext) {
        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (AudioContextClass) {
            audioContext =
                new AudioContextClass();
        }
    }

    return audioContext;
}

/*
最初のEnterキー操作で、
ブラウザの音声制限を解除します。
*/
async function unlockAudio() {
    const context =
        getAudioContext();

    if (!context) {
        throw new Error(
            "音声機能を利用できません。"
        );
    }

    if (
        context.state !==
        "running"
    ) {
        await context.resume();
    }

    /*
    ほぼ無音の短い音
    */
    const oscillator =
        context.createOscillator();

    const gain =
        context.createGain();

    gain.gain.setValueAtTime(
        0.0001,
        context.currentTime
    );

    oscillator.connect(gain);
    gain.connect(
        context.destination
    );

    oscillator.start(
        context.currentTime
    );

    oscillator.stop(
        context.currentTime +
        0.02
    );
}

async function playTone(
    frequency,
    durationMs,
    volume = 0.20
) {
    try {
        const context =
            getAudioContext();

        if (!context) {
            return false;
        }

        if (
            context.state !==
            "running"
        ) {
            await context.resume();
        }

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();

        const now =
            context.currentTime;

        const duration =
            durationMs / 1000;

        const attack =
            Math.min(
                0.08,
                duration * 0.25
            );

        const release =
            Math.min(
                0.22,
                duration * 0.45
            );

        oscillator.type =
            "sine";

        oscillator.frequency
            .setValueAtTime(
                frequency,
                now
            );

        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain
            .exponentialRampToValueAtTime(
                volume,
                now + attack
            );

        gain.gain.setValueAtTime(
            volume,
            now + Math.max(
                attack,
                duration - release
            )
        );

        gain.gain
            .exponentialRampToValueAtTime(
                0.0001,
                now + duration
            );

        oscillator.connect(gain);

        gain.connect(
            context.destination
        );

        oscillator.start(now);

        oscillator.stop(
            now + duration
        );

        return true;

    } catch (error) {
        console.error(
            "音声を再生できませんでした。",
            error
        );

        return false;
    }
}

/*
最初のEnterキー押下時と、
開始5秒前に使用します。
*/
function playWarningTone() {
    void playTone(
        WARNING_TONE.frequency,
        WARNING_TONE.duration,
        WARNING_TONE.volume
    );
}

/*
タスク開始時と終了時に使用します。
*/
function playEventTone() {
    void playTone(
        EVENT_TONE.frequency,
        EVENT_TONE.duration,
        EVENT_TONE.volume
    );
}

/* ==================================================
   開始前の30秒待機
================================================== */

async function beginPreparation() {
    if (
        preparationStarted ||
        isPreparing ||
        isRunning
    ) {
        return;
    }

    preparationStarted = true;
    isPreparing = true;

    results = [];

    /*
    最初のEnterキー操作の中で
    AudioContextを有効化します。
    */
    try {
        await unlockAudio();

    } catch (error) {
        console.error(
            "音声の初期化に失敗しました。",
            error
        );

        preparationStarted =
            false;

        isPreparing =
            false;

        enterStartDiv.textContent =
            "音声を有効にできませんでした。ページを再読み込みしてください。";

        return;
    }

    enterStartDiv.style.display =
        "none";

    taskInstruction.style.visibility =
        "hidden";

    box.style.background =
        "gray";

    box.classList.add(
        "waiting"
    );

    box.textContent =
        "✖";

    countdownDiv.textContent =
        "";

    preparationMessage.textContent =
        "開始まで注視点を見て待機してください";

    /*
    最初のEnterキー押下時に、
    開始5秒前と同じ警告音を鳴らします。
    */
    playWarningTone();

    countdownStartTimer =
        setTimeout(
            startCountdown,
            PREPARATION_DURATION -
            COUNTDOWN_DURATION
        );

    preparationTimer =
        setTimeout(
            beginTask,
            PREPARATION_DURATION
        );
}

/*
最初のEnterキー入力
*/
document.addEventListener(
    "keydown",
    event => {
        if (
            event.key !==
                "Enter" ||
            event.repeat
        ) {
            return;
        }

        if (
            preparationStarted ||
            isPreparing ||
            isRunning
        ) {
            return;
        }

        event.preventDefault();

        void beginPreparation();
    }
);

/* ==================================================
   開始5秒前のカウントダウン
================================================== */

function startCountdown() {
    if (!isPreparing) {
        return;
    }

    /*
    最初のEnterキー押下時と
    同じ警告音を鳴らします。
    */
    playWarningTone();

    preparationMessage.textContent =
        "";

    let remaining = 5;

    countdownDiv.textContent =
        remaining;

    countdownInterval =
        setInterval(
            () => {
                remaining--;

                countdownDiv.textContent =
                    remaining > 0
                        ? remaining
                        : "";

                if (
                    remaining <= 0
                ) {
                    clearInterval(
                        countdownInterval
                    );

                    countdownInterval =
                        null;
                }
            },
            1000
        );
}

/* ==================================================
   練習本体開始
================================================== */

function beginTask() {
    if (!isPreparing) {
        return;
    }

    isPreparing = false;
    isRunning = true;

    clearInterval(
        countdownInterval
    );

    countdownInterval =
        null;

    countdownDiv.textContent =
        "";

    preparationMessage.textContent =
        "";

    taskInstruction.style.visibility =
        "visible";

    /*
    タスク開始時の音
    */
    playEventTone();

    forceEndTimer =
        setTimeout(
            () => {
                if (isRunning) {
                    endTest();
                }
            },
            TEST_DURATION
        );

    startTest();
}

/* ==================================================
   試行開始
================================================== */

function startTest() {
    if (!isRunning) {
        return;
    }

    /*
    直前の刺激タイマーが残っている場合は
    解除します。
    */
    clearTimeout(
        stimulusTimer
    );

    box.style.background =
        "gray";

    box.classList.add(
        "waiting"
    );

    box.textContent =
        "✖";

    waiting = true;

    /*
    赤刺激が表示されていない状態なので、
    前試行の開始時刻を消去します。
    */
    startTime = undefined;

    /*
    1,000 ms以上、4,000 ms未満の
    ランダム待機
    */
    const delay =
        Math.random() *
        3000 +
        1000;

    nextStimulusPerfTime =
        performance.now() +
        delay;

    stimulusTimer =
        setTimeout(
            () => {
                if (!isRunning) {
                    return;
                }

                requestAnimationFrame(
                    () => {
                        if (
                            !isRunning
                        ) {
                            return;
                        }

                        box.style.background =
                            "red";

                        box.classList.remove(
                            "waiting"
                        );

                        box.textContent =
                            "Enter!";

                        startTime =
                            performance.now();

                        waiting =
                            false;
                    }
                );
            },
            delay
        );
}

/* ==================================================
   PVT反応用Enter
================================================== */

document.addEventListener(
    "keydown",
    event => {
        if (
            event.key !==
                "Enter" ||
            event.repeat
        ) {
            return;
        }

        if (keyLocked) {
            return;
        }

        keyLocked = true;

        handleResponse();
    }
);

document.addEventListener(
    "keyup",
    event => {
        if (
            event.key ===
            "Enter"
        ) {
            keyLocked =
                false;
        }
    }
);

/* ==================================================
   反応処理
================================================== */

function handleResponse() {
    if (!isRunning) {
        return;
    }

    /*
    赤刺激提示前の先行反応
    */
    if (waiting) {
        const remaining =
            Math.max(
                0,
                Math.round(
                    nextStimulusPerfTime -
                    performance.now()
                )
            );

        /*
        次の刺激までの残り時間を
        負の値で記録します。
        */
        results.push(
            -remaining
        );

        return;
    }

    /*
    赤刺激の表示開始時刻がない場合は
    記録しません。
    */
    if (
        startTime ===
        undefined
    ) {
        return;
    }

    /*
    赤刺激提示後の通常反応
    */
    const rt =
        Math.round(
            performance.now() -
            startTime
        );

    results.push(rt);

    startTest();
}

/* ==================================================
   テスト終了
================================================== */

function endTest() {
    if (!isRunning) {
        return;
    }

    isRunning = false;
    waiting = false;

    clearTimeout(
        stimulusTimer
    );

    clearTimeout(
        forceEndTimer
    );

    /*
    課題終了時に、
    タスク開始時と同じ音を鳴らします。
    */
    playEventTone();

    /*
    終了時に赤刺激が提示途中だった場合は、
    未完了試行としてresultsには追加しません。
    */
    startTime =
        undefined;

    box.style.background =
        "black";

    box.classList.remove(
        "waiting"
    );

    box.textContent =
        "終了";

    countdownDiv.textContent =
        "";

    preparationMessage.textContent =
        "";

    taskInstruction.style.visibility =
        "hidden";
}
</script>

</body>
</html>
